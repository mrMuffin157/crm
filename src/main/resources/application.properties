# Settings shared across every real-MySQL environment live here. Everything that actually
# differs per environment (datasource host/name, CORS origin) lives in
# application-dev.properties / application-test.properties / application-prod.properties
# instead, selected via SPRING_PROFILES_ACTIVE — there is no default datasource here, so one of
# dev/test/prod must always be chosen explicitly.

spring.application.name=crm

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Ticket update/create history — Envers' own default audit table suffix is "_AUD"
# (uppercase); forced lowercase here so the generated table name always matches the hand-written
# ticket_aud/ticket_comment_aud/ticket_line_item_aud in schema.sql/doc/0.6.0 regardless of the
# MySQL server's lower_case_table_names setting (table names, unlike column names, can be
# case-sensitive there).
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud

# ddl-auto=none above deliberately never touches the real legacy-app-owned tables. app_user_role
# is this app's own table though, and needs to exist somehow — schema.sql (plain JDBC DDL, not
# Hibernate) creates it here.
spring.sql.init.mode=always

# Bootstrap admin's password — see BootstrapAdminSeeder. Override via env var rather than
# editing this file, same reasoning as DB_USER/DB_PASSWORD in the dev/test/prod profile files:
# a real password shouldn't only ever exist as a literal in version-controlled source.
app.bootstrap-admin-password=${BOOTSTRAP_ADMIN_PASSWORD}

# Keycloak login toggle — off by default, since no Keycloak realm/client is provisioned for this
# app yet. When off, SecurityConfig never wires .oauth2Login() and the existing username/password
# flow (AuthController) is the only way in; these spring.security.oauth2.client.* properties are
# only ever consulted once a request actually tries to reach Keycloak, so leaving them at their
# blank/placeholder defaults is safe with the toggle off. See CLAUDE.md for the s2user/
# app_user_role allowlist Keycloak logins still have to pass — Keycloak only authenticates,
# it never grants access or a role on its own.
app.keycloak.enabled=${KEYCLOAK_ENABLED:false}
app.keycloak.base-url=${KEYCLOAK_BASE_URL:}
app.keycloak.realm=${KEYCLOAK_REALM:exampleco}
app.keycloak.client-id=${KEYCLOAK_CLIENT_ID:crm}
# Where Keycloak sends the browser back to after its own logout page — reusing the frontend's
# own origin rather than inventing a separate env var, since that's already known per environment.
app.keycloak.post-logout-redirect-uri=${KEYCLOAK_POST_LOGOUT_REDIRECT_URI:${app.cors.allowed-origins}}

# The {baseUrl} in the redirect-uri below is built from the incoming request, so behind a
# TLS-terminating reverse proxy (nginx on the stage/prod deployments) it would otherwise resolve
# to http://<internal-host>:8080 and Keycloak would reject the callback as an unregistered
# redirect_uri. "framework" makes WebFlux honor the proxy's X-Forwarded-Proto/Host instead.
# Harmless with no proxy in front — a request with no X-Forwarded-* headers is unchanged.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:crm}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.keycloak.authorization-uri=${KEYCLOAK_BASE_URL:}/realms/${KEYCLOAK_REALM:exampleco}/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_BASE_URL:}/realms/${KEYCLOAK_REALM:exampleco}/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${KEYCLOAK_BASE_URL:}/realms/${KEYCLOAK_REALM:exampleco}/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-info-uri=${KEYCLOAK_BASE_URL:}/realms/${KEYCLOAK_REALM:exampleco}/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# legacy-app's own JWT flow: exchange this refresh token for a short-lived Bearer access token
# (see LegacyApiClient), used to fan a Sales Order lookup out to all 4 storefront hosts below.
# No default — it's a secret, same treatment as DB_USER/DB_PASSWORD.
legacy.api.refresh-token=${LEGACY_API_REFRESH_TOKEN}

# The inbound mirror of the token above: legacy-app presents this refresh token to
# LegacyOauthController's POST /oauth/access_token (the same grant_type=refresh_token contract
# legacy-app's own /oauth/access_token speaks) to redeem a short-lived JWT, then uses that JWT as its
# Bearer credential against this app's ticket M2M API (see LegacyServiceAuthenticationFilter,
# LegacyServiceTokenService). Both properties are secrets with no default, same treatment as
# DB_USER/DB_PASSWORD — jwt-signing-key must be at least 256 bits (32 bytes) for the HS256 signer.
# CRM_API_REFRESH_TOKEN is deliberately the same variable name legacy-app uses for it (its pkg-core
# plugin.yml `n.crm`), since it's the same shared value on both sides. CRM_JWT_SIGNING_KEY is
# named after this app instead: it never leaves this JVM, and legacy-app has its own separate one.
app.legacy-service.refresh-token=${CRM_API_REFRESH_TOKEN}
app.legacy-service.jwt-signing-key=${CRM_JWT_SIGNING_KEY}

# NotifyFailedTicketsJob's daily digest email (replacing legacy-app's own 08:00 job
# of the same name) — every ticket currently ProcessFailed, mailed to every current ROLE_ADMIN.
# Default is 8am server time, matching legacy-app's original schedule. Not a secret, but still
# overridable per environment like every other setting here.
# this is now only a SEED value for QuartzConfig's trigger bean — consulted only the
# first time QRTZ_TRIGGERS has no row for it. Once that trigger exists, the live schedule in the
# database is the permanent source of truth (spring.quartz.overwrite-existing-jobs=false below);
# changing this env var afterward has no effect until an admin reschedules it via the Scheduled
# Jobs admin UI (or the QRTZ_TRIGGERS/QRTZ_CRON_TRIGGERS rows are deleted by hand).
app.notify-failed-tickets.cron=${NOTIFY_FAILED_TICKETS_CRON:0 0 8 * * ?}

# NotifyRefundTicketsJob's daily digest (replacing legacy-app's own 15:10 job of the same
# name) — every open (not yet Closed/Cancelled) Refund-action ticket, published as a TelegramTO
# over the same RabbitMQ broker as the digest above (see RefundTicketNotificationService). Same
# seed-value caveat as app.notify-failed-tickets.cron: only consulted the first time
# QRTZ_TRIGGERS has no row for it.
app.notify-refund-tickets.cron=${NOTIFY_REFUND_TICKETS_CRON:0 10 15 * * ?}
# Telegram chat id(s) notified for a US-channel ticket (comma-separated, e.g. multiple staff
# members) — mirrors legacy-app's NOTIFY_REFUND_TICKET_MEMBER LegacyParam, but holds chat ids directly
# since CRM has no User/telegramChatId table to resolve a username through. Blank means the US
# digest is a no-op (see RefundTicketNotificationService#sendDigest).
app.notify-refund-tickets.member-chat-ids=${NOTIFY_REFUND_TICKET_MEMBER:}
# Telegram chat id notified for every non-US channel ticket — mirrors legacy-app's
# Holders.config.gsmAlarmGroup. Blank means that digest is a no-op.
app.notify-refund-tickets.gsm-alarm-group-chat-id=${GSM_ALARM_GROUP:}

# Quartz job scheduling — JDBC JobStore persisted into this same app-owned MySQL
# schema via the hand-rolled QRTZ_* tables in doc/0.6.0/create_quartz_tables.sql (applied by hand
# per environment, same convention as every other DDL script here). initialize-schema=never
# because DDL here is always hand-rolled, never Hibernate/Quartz auto-DDL — same reasoning as
# spring.jpa.hibernate.ddl-auto=none above. overwrite-existing-jobs=false: once a job/trigger
# exists in QRTZ_*, an admin's live Pause/Resume/Re-Schedule (via the Scheduled Jobs admin UI) is
# the permanent source of truth and must survive restarts/redeploys — do not flip this to true.
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.overwrite-existing-jobs=false
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
# Keeps JobDataMap values as plain string columns instead of a Java-serialized blob column —
# safer across redeploys with a different classpath. No job here needs a non-String value.
spring.quartz.properties.org.quartz.jobStore.useProperties=true
# Single JVM only — same assumption already documented for WebSession/createLock in CLAUDE.md's
# "Known single-instance assumptions", not a new one. Don't enable clustering without addressing
# those first.
spring.quartz.properties.org.quartz.jobStore.isClustered=false
spring.quartz.properties.org.quartz.scheduler.instanceName=CrmScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO

# RabbitMQ broker NotifyFailedTicketsService publishes the digest's MailTO onto (see
# FailedTicketNotificationMailService — exchange/routing key are a fixed contract with the
# mail-sending consumer, not per-environment, so they're hardcoded there rather than configured
# here). No default on host/username/password — same reasoning as
# DB_USER/DB_PASSWORD/LEGACY_API_REFRESH_TOKEN: guessing a broker would risk silently publishing
# nowhere useful (or authenticating as the wrong account).
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}

# From address on the digest's MailTO envelope. No default, same reasoning as the broker
# credentials above.
app.mail.from-address=${MAIL_FROM_ADDRESS}

# Buyer-facing "replacement shipped" mail (ReplacementShippedMailService), published
# onto the same RabbitMQ broker/exchange as the digest above. Fail-closed by default: disabled
# here, enabled only in application-prod.properties (mirrors app.keycloak.enabled's own
# precedent) — dev/test point at the real staging crm_dev, whose ticket.email holds real buyer
# addresses, and share prod's broker/mail consumer, so nothing but this toggle stops a local
# `./gradlew bootRun` from mailing an actual customer. See that service's own comment for the
# other two safety layers (recipientOverride below, and a hard refusal on any non-prod profile
# with no override set) — this toggle is not the only thing standing between a stray click and a
# real buyer's inbox.
app.replacement-shipped-mail.enabled=${REPLACEMENT_SHIPPED_MAIL_ENABLED:false}
# When non-blank, every replacement-shipped mail goes here instead of the ticket's own buyer
# email, in every profile, with the real address prefixed into the subject. Also replaces
# notify-bcc below, so a redirected test mail never reaches CS. The only supported way to
# exercise this mail outside prod.
app.replacement-shipped-mail.recipient-override=${REPLACEMENT_SHIPPED_MAIL_RECIPIENT_OVERRIDE:}
# BCC'd on every manual-close replacement-shipped mail (never the CSV bulk-close path — see
# TicketCloseService#close's own comment). Matches legacy-app's own legacyParamService fallback for
# TICKET_TRACKING_NO_NOTIFY_BCC. Blank means no BCC.
app.replacement-shipped-mail.notify-bcc=${REPLACEMENT_SHIPPED_MAIL_NOTIFY_BCC:}

# Per-channel from/subject/sign-off for the mail above — a faithful port of legacy-app's
# `[SYS]Manual Handling Ticket Closed Notify for customer` email_template rows, pulled
# byte-exact from stage. Not secrets and not environment-dependent (unlike the datasource), so
# these live here rather than per-profile. brande-ca/brande-au/mx/deco-ca are deliberately left
# unset — same gap legacy.api.hosts.* documents (az-decoca has no email_template row in legacy-app at
# all) — so ReplacementShippedMailProperties.Channels#forSourceSystem resolves those to null and
# the mail service skips them with a WARN rather than sending with a blank From.
app.replacement-shipped-mail.channels.us.from-address=brandc-us@example.com
app.replacement-shipped-mail.channels.us.subject=Replacement from EPFamily Direct products
app.replacement-shipped-mail.channels.us.sign-off=EPFamily Customer Support

app.replacement-shipped-mail.channels.deco.from-address=brandb-us@example.com
app.replacement-shipped-mail.channels.deco.subject=Replacement from BrandB Direct products
app.replacement-shipped-mail.channels.deco.sign-off=BrandB Direct&nbsp;Customer Support

app.replacement-shipped-mail.channels.ca.from-address=brandc-ca@example.com
app.replacement-shipped-mail.channels.ca.subject=Replacement from EPFamily Direct products
app.replacement-shipped-mail.channels.ca.sign-off=EPFamily Customer Support

app.replacement-shipped-mail.channels.au.from-address=brandc-au@example.com
app.replacement-shipped-mail.channels.au.subject=Replacement from EPFamily Direct products
app.replacement-shipped-mail.channels.au.sign-off=EPFamily Customer Support
