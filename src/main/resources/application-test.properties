# Activated with SPRING_PROFILES_ACTIVE=test — a separate QA/staging-style database (crm_test)
# so manual/QA testing never collides with day-to-day dev data. NOT the same thing as
# `./gradlew test` (CrmApplicationTests), which runs against whatever profile happens to be
# active rather than this one specifically.

# allowPublicKeyRetrieval defaults false (safe/unchanged) — see application-dev.properties' own
# comment for why a caching_sha2_password account needs it set to connect at all here.
spring.datasource.url=jdbc:mysql://${DB_HOST:db-stage.example.internal}:${DB_PORT:3308}/${DB_NAME:crm_test}?useSSL=false&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173}

# Sales Order lookup fans out to legacy-app's staging hosts by default here, matching how test
# already points at a staging-style database.
legacy.api.hosts.us=${LEGACY_US_API_URL:https://us.storefront-stage.example.internal}
legacy.api.hosts.deco=${LEGACY_DECO_API_URL:https://deco.storefront-stage.example.internal}
legacy.api.hosts.ca=${LEGACY_CA_API_URL:https://ca.storefront-stage.example.internal}
legacy.api.hosts.au=${LEGACY_AU_API_URL:https://au.storefront-stage.example.internal}
