# Activated with SPRING_PROFILES_ACTIVE=dev — the default day-to-day development target: the
# shared staging MySQL server, crm_dev database.

# allowPublicKeyRetrieval defaults false (safe/unchanged) — MySQL 8's caching_sha2_password auth
# plugin needs it (or SSL) to fetch the server's RSA public key for password encryption; without
# it, a caching_sha2_password account fails to connect at all over this useSSL=false URL with
# "Public Key Retrieval is not allowed". Flip DB_ALLOW_PUBLIC_KEY_RETRIEVAL=true in your own local
# .env if your account hits that.
spring.datasource.url=jdbc:mysql://${DB_HOST:db-stage.example.internal}:${DB_PORT:3308}/${DB_NAME:crm_dev}?useSSL=false&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173}

# Sales Order lookup fans out to legacy-app's staging hosts by default here, matching how dev
# already points at a staging-style database.
legacy.api.hosts.us=${LEGACY_US_API_URL:https://us.storefront-stage.example.internal}
legacy.api.hosts.deco=${LEGACY_DECO_API_URL:https://deco.storefront-stage.example.internal}
legacy.api.hosts.ca=${LEGACY_CA_API_URL:https://ca.storefront-stage.example.internal}
legacy.api.hosts.au=${LEGACY_AU_API_URL:https://au.storefront-stage.example.internal}
