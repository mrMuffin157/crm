# Activated with SPRING_PROFILES_ACTIVE=prod
# DB_HOST/DB_NAME/APP_CORS_ORIGINS have NO defaults here, deliberately — same reasoning as
# DB_USER/DB_PASSWORD: guessing a production hostname, database name, or frontend origin would
# be actively dangerous (silently pointing prod at staging, or misconfiguring CORS). All must be
# set explicitly at deploy time.

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

app.cors.allowed-origins=${APP_CORS_ORIGINS}

# Sales Order lookup fans out to legacy-app's real production hosts by default here.
legacy.api.hosts.us=${LEGACY_US_API_URL:https://us.storefront.example.internal}
legacy.api.hosts.deco=${LEGACY_DECO_API_URL:https://deco.storefront.example.internal}
legacy.api.hosts.ca=${LEGACY_CA_API_URL:https://ca.storefront.example.internal}
legacy.api.hosts.au=${LEGACY_AU_API_URL:https://au.storefront.example.internal}

# The one profile where the buyer-facing "replacement shipped" mail is actually
# allowed to reach a real buyer — see application.properties' own comment for the full safety
# reasoning. Still env-var overridable like every other setting here, which is a deliberately
# accepted risk (see ReplacementShippedMailService's own comment): don't "fix" this into a
# hardcoded true without re-reading why.
app.replacement-shipped-mail.enabled=${REPLACEMENT_SHIPPED_MAIL_ENABLED:true}
